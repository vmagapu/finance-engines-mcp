[project]
name = "finance-engines-mcp"
version = "0.1.0"
description = "Deterministic financial calculation engines exposed as MCP tools - because LLMs should exercise judgment, not arithmetic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vish Magapu", email = "vmagapu@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "finance", "llm", "agents", "deterministic"]
dependencies = ["mcp>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finance-engines-mcp = "finance_engines_mcp.server:main"

[project.urls]
Homepage = "https://github.com/vmagapu/finance-engines-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_engines_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
